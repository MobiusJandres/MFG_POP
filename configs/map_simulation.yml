# Core Experiment Metadata
exp_name: "map_simulation"
run_name: "multi_goal_evasion"
results_dir: "results"
timezone: "UTC"

# Environment & Grid Setup
map_file: "Maps/AcrosstheCape.map"
scen_file: "Scenarios/AcrosstheCape_1g.map.scen"
room_width: 768.0
room_height: 768.0
Nx: 100
Ny: 100
num_agents: 50

# Behavior & Objective Settings
goals_are_exits: true               # Active goals act as mass-absorbing exits
obstacle_penalty: -50000.0           # Repulsive potential barrier around walls
running_cost_weight: 0.01           # Running cost scaling weight (w_R) for t < T
terminal_cost_weight: 0.01          # Terminal cost scaling weight (w_T) at t = T
running_cost_power: 2               # Distance power p_R (2 for squared distance)
terminal_cost_power: 2              # Distance power p_T (2 for squared distance)
saturated_goal_penalty: 50.0        # Positive repulsive barrier around filled goals

# Time & Solver Parameters
T: 5.0
Nt: 150
max_iters: 15
relaxation_theta: 0.1

# Heterogeneous Goal Dictionaries
goals:
  # - type: "stationary"
  #   position: [100.0, 700.0]

  # - type: "prescribed"
  #   position: [700.0, 700.0]
  #   path_x: "700.0 + 50.0 * sin(2.0 * pi * t / T)"
  #   path_y: "700.0"

  - type: "evader"
    position: [100.0, 700.0]
    v_max: 15.0
    capacity: 25.0

  - type: "evader"
    position: [700.0, 700.0]
    v_max: 5.0
    capacity: 10.0

  - type: "evader"
    position: [384.0, 100.0]
    v_max: 25.0