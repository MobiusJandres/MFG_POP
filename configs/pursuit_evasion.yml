# Core Experiment Metadata
exp_name: "pursuit_evasion_suite"
run_name: "multi_target_evasion"
results_dir: "results"
timezone: "UTC"

# Environment & Grid Setup
map_file: "MAP2PDE/Maps/AcrosstheCape.map"
scen_file: "MAP2PDE/Scenarios/AcrosstheCape_1g.map.scen"
room_width: 768.0
room_height: 768.0
Nx: 100
Ny: 100
num_agents: 50

# Target behavior toggle
targets_are_exits: false  # Set to true if you want mass to exit at targets

# Custom Multiple Initial Target Placements [x, y] in physical meters
# (Set to null/None if you prefer to use the goal positions from scen_file instead)
targets:
  - [100.0, 700.0]  # Target 1 (Top-Left)
  - [700.0, 700.0]  # Target 2 (Top-Right)
  - [384.0, 100.0]  # Target 3 (Bottom-Center)

# Time & Solver Parameters
T: 5.0
Nt: 150
max_iters: 15
relaxation_theta: 0.1

# Pursuit-Evasion Dynamics
v_max_evader: 25.0